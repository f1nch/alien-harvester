<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organic creature review</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#111a22;color:#e0eee8;font:15px system-ui}
  main{max-width:1000px;margin:auto;padding:18px}h1{font-size:22px;margin:0 0 5px}
  p{color:#afc2bc;margin:0 0 14px}canvas{width:100%;height:55vh;min-height:320px;display:block;touch-action:none;border-radius:16px}
  nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,select{background:#243630;color:inherit;border:1px solid #57786c;padding:12px;border-radius:9px;min-height:44px;font:inherit}
  button[aria-pressed=true]{background:#2c6651;border-color:#91e6bd}label{display:flex;align-items:center;gap:8px}#status{font-size:13px}
  a{color:#a8e0c7}
</style>
<main>
  <h1>Evolving eyes and scorpion pincers</h1>
  <p>Smoother anatomy, textured tissue and chitin, grounded motion. Drag to orbit; scroll to zoom.</p>
  <nav aria-label="Evolution stages">
    <button data-tier="0" aria-pressed="true">Hatchling</button><button data-tier="1" aria-pressed="false">Juvenile</button><button data-tier="2" aria-pressed="false">Adult</button><button data-tier="3" aria-pressed="false">Apex</button>
  </nav>
  <canvas id="review" aria-label="Animated creature preview"></canvas>
  <div class="controls">
    <label>Motion <select id="motion"><option value="0">Idle</option><option value="1">Walk</option><option value="3">Run</option></select></label>
    <button id="capture" aria-pressed="false">Capture</button><button id="turn" aria-pressed="false">Turn</button><button id="gulp">Gulp</button><button id="hurt">Hurt</button>
  </div>
  <p id="status" role="status">Loading four refined models…</p>
</main>
<script type="module" src="./creature-review.ts"></script>
</html>
